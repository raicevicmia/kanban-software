<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Softver</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <p class="header-title">Kanban Board</p>
      <p class="customize-bg"><i class="fa fa-gear"></i> Customize background</p>
    </header>

    <div class="kanban-container">
      <div class="col-container">
        <!-- cols will be rendered here -->
      </div>

      <!-- this button is the only initially visible element from kanban-container -->
      <button id="add-list-btn">
        <i class="fa list-plus fa-plus"></i> Add a list
      </button>

      <!-- here form is rendered after button click, replaces that button & then disappears again after submission
      <form class="add-col-form">
        <input type="text" class="add-col-in" />
        <div class="add-col-btns">
          <button type="submit" class="add-col-btn">Add list</button>
          <button class="x-mark"><i class="fas fa-xmark"></i></div>
          </button>
      </form>
        -->
    </div>

    <!--  POPUPs  -->

    <dialog id="col-dialog">
      <div class="col-palette">
        <p class="col-clr">Color</p>
        <div id="col-palette">
          <i class="fas fa-circle fa-c-grey"></i>
          <i class="fas fa-circle fa-c-blue"></i>
          <i class="fas fa-circle fa-c-green"></i>
          <i class="fas fa-circle fa-c-yellow"></i>
          <i class="fas fa-circle fa-c-coral"></i>
        </div>
      </div>
      <div class="col-name">
        <p class="col-n">Title</p>
        <div class="form-wrapper">
          <form class="col-form">     
            <input type="text" id="change-col-name" placeholder="Rename list">        
          </form>
        </div>
        <div class="del-btn-wrapper">
        <button id="popup-delete" class="delCol" type="button">Delete</button>
          </div>
      </div>
    </dialog>
    
    <dialog id="confirm-col-dialog">
      <div class="confirm-col">
        <p>Are you sure you want to delete this list?</p>
        <div class="confirm-buttons">
          <button id="confirm-delete" class="confirm-col-delete">Yes, delete it</button>
          <button id="confirm-not-delete" class="not-confirm-col-delete">No</button>
        </div>
      </div>
    </dialog>

    
    <!-- task dialog -->
    <dialog id="task-dialog">   
      <div class="task-dialog-header col-color">
        <i class="fas popup-xmark fa-xmark"></i>
      </div>
      <div class="task-dialog">

      <div class="task-name-wrapper">
        <p class="task-n">Title</p>
        <input type="text" id="change-task-name"></input>

        <div class="task-details-wrapper">
          <div class="task-assignee-wrapper">
            <p class="assignee-n">Assigned to:</p>
            <p class="task-assignee"></p>
            <i class="fas fa-user-pen" id="change-task-assignee"></i>
          </div>

          <div class="prio-and-date-wrapper">
            <div class="priority-task">
              <p class="task-tag"><i class="fas fa-sort"></i></p>
              <select id="task-priority">
                <option value="select" selected>Priority</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="due-date-opt">
              <p class="task-tag">
                <i class="fas fa-clock-rotate-left"></i>
              </p>
              <span id="due-date-display">Select date</span>

              <input type="date" id="task-due-date" name="due-date">
            </div>
          </div>
        </div>

      </div>

       <div class="proj-name-wrapper">
        <p class="proj-n">Project</p>
        <input type="text" id="change-proj-name" placeholder="Add project name..."></input>
      </div>

       <div class="task-descr-wrapper">
        <p class="proj-n">Description</p>
        <form class="task-descr">
          <input type="text" id="change-task-descr" placeholder="Add task description..."></input>
        </form>
      </div>

        <!-- save / delete -->
        <div class="save-del-btns">
          <button id="popup-delete">Delete</button>
          <button id="popup-save">Save</button>
        </div>
      </div>
    </dialog>

    <!--confirm task deletion dialog-->
    <dialog id="confirm-task-dialog">
      <div class="confirm-task">
        <p>Are you sure you want to delete this task?</p>
        <div class="confirm-buttons">
          <button id="confirm-delete" class="confirm-task-delete">Yes, delete it</button>
          <button id="confirm-not-delete" class="not-confirm-task-delete">No</button>
        </div>
      </div>
    </dialog>

    <!-- customize bg dialog -->
    <dialog id="bg-dialog" class="bg-dialog">
      <div class="bg-header">
        <p>Customize background</p>
        <i class="fas fa-xmark bg-close"></i>
      </div>

      <div class="bg-upload">
        <input type="file" id="bg-upload-input" accept="image/*" />
      </div>

      <div class="bg-actions">
        <button class="bg-reset">Reset</button>
      </div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
